<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Dashboard Table</title>
  <style>
    table {
      border-collapse: separate;
      border-spacing: 1px;
      margin: 20px auto;
    }
    td {
      width: 120px;
      height: 80px;
      text-align: center;
      vertical-align: middle;
      font-family: Arial, sans-serif;
      font-size: 16px;
      font-weight: bold;
      color: white;
      background-clip: padding-box;
    }
    .red    { background-color: #e74c3c; }
    .green  { background-color: #27ae60; }
    .blue   { background-color: #2980b9; }
    .orange { background-color: #e67e22; }
    .purple { background-color: #8e44ad; }
  </style>
</head>
<body style="background-color: #fff;">
  <table>
    <tr>
      <td class="red">Cell 1</td>
      <td class="green">Cell 2</td>
      <td class="blue">Cell 3</td>
    </tr>
    <tr>
      <td class="orange">Cell 4</td>
      <td class="purple">Cell 5</td>
      <td class="red">Cell 6</td>
    </tr>
    <tr>
      <td class="green">Cell 7</td>
      <td class="blue">Cell 8</td>
      <td class="orange">Cell 9</td>
    </tr>
    <tr>
      <td class="purple">Cell 10</td>
      <td class="red">Cell 11</td>
      <td class="green">Cell 12</td>
    </tr>
    <tr>
      <td class="blue">Cell 13</td>
      <td class="orange">Cell 14</td>
      <td class="purple">Cell 15</td>
    </tr>
  </table>
</body>
</html>
