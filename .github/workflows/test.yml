name: Test CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CI_BRANCH: ${{ github.head_ref || github.ref_name }}
  GITHUB_REPOSITORY: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
        
    steps:
      - uses: actions/checkout@v5

      - name: Generate dashboard SVG
        run: |
          cat > dashboard.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="390" height="330" viewBox="0 0 390 330">
            <rect width="100%" height="100%" fill="#f8f9fa"/>
            <!-- Row 1 -->
            <rect x="10" y="10" width="120" height="60" fill="#4CAF50" stroke="#333" stroke-width="2"/>
            <rect x="135" y="10" width="120" height="60" fill="#2196F3" stroke="#333" stroke-width="2"/>
            <rect x="260" y="10" width="120" height="60" fill="#FFC107" stroke="#333" stroke-width="2"/>
            <text x="70" y="45" font-size="24" text-anchor="middle" fill="#fff" font-family="sans-serif">Cell 1</text>
            <text x="195" y="45" font-size="24" text-anchor="middle" fill="#fff" font-family="sans-serif">Cell 2</text>
            <text x="320" y="45" font-size="24" text-anchor="middle" fill="#333" font-family="sans-serif">Cell 3</text>
            <!-- Row 2 -->
            <rect x="10" y="75" width="120" height="60" fill="#E91E63" stroke="#333" stroke-width="2"/>
            <rect x="135" y="75" width="120" height="60" fill="#9C27B0" stroke="#333" stroke-width="2"/>
            <rect x="260" y="75" width="120" height="60" fill="#00BCD4" stroke="#333" stroke-width="2"/>
            <text x="70" y="110" font-size="24" text-anchor="middle" fill="#fff" font-family="sans-serif">Cell 4</text>
            <text x="195" y="110" font-size="24" text-anchor="middle" fill="#fff" font-family="sans-serif">Cell 5</text>
            <text x="320" y="110" font-size="24" text-anchor="middle" fill="#fff" font-family="sans-serif">Cell 6</text>
            <!-- Row 3 -->
            <rect x="10" y="140" width="120" height="60" fill="#FF5722" stroke="#333" stroke-width="2"/>
            <rect x="135" y="140" width="120" height="60" fill="#795548" stroke="#333" stroke-width="2"/>
            <rect x="260" y="140" width="120" height="60" fill="#607D8B" stroke="#333" stroke-width="2"/>
            <text x="70" y="175" font-size="24" text-anchor="middle" fill="#fff" font-family="sans-serif">Cell 7</text>
            <text x="195" y="175" font-size="24" text-anchor="middle" fill="#fff" font-family="sans-serif">Cell 8</text>
            <text x="320" y="175" font-size="24" text-anchor="middle" fill="#fff" font-family="sans-serif">Cell 9</text>
            <!-- Row 4 -->
            <rect x="10" y="205" width="120" height="60" fill="#8BC34A" stroke="#333" stroke-width="2"/>
            <rect x="135" y="205" width="120" height="60" fill="#FF9800" stroke="#333" stroke-width="2"/>
            <rect x="260" y="205" width="120" height="60" fill="#03A9F4" stroke="#333" stroke-width="2"/>
            <text x="70" y="240" font-size="24" text-anchor="middle" fill="#fff" font-family="sans-serif">Cell 10</text>
            <text x="195" y="240" font-size="24" text-anchor="middle" fill="#fff" font-family="sans-serif">Cell 11</text>
            <text x="320" y="240" font-size="24" text-anchor="middle" fill="#fff" font-family="sans-serif">Cell 12</text>
            <!-- Row 5 -->
            <rect x="10" y="270" width="120" height="60" fill="#CDDC39" stroke="#333" stroke-width="2"/>
            <rect x="135" y="270" width="120" height="60" fill="#F44336" stroke="#333" stroke-width="2"/>
            <rect x="260" y="270" width="120" height="60" fill="#3F51B5" stroke="#333" stroke-width="2"/>
            <text x="70" y="305" font-size="24" text-anchor="middle" fill="#333" font-family="sans-serif">Cell 13</text>
            <text x="195" y="305" font-size="24" text-anchor="middle" fill="#fff" font-family="sans-serif">Cell 14</text>
            <text x="320" y="305" font-size="24" text-anchor="middle" fill="#fff" font-family="sans-serif">Cell 15</text>
          </svg>
          EOF

      - name: Encode and add dashboard to summary
        run: |
          echo "![Dashboard](data:image/svg+xml;base64,$(base64 -w 0 dashboard.svg))" >> $GITHUB_STEP_SUMMARY        
