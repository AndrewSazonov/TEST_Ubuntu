name: Test CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CI_BRANCH: ${{ github.head_ref || github.ref_name }}
  GITHUB_REPOSITORY: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
        
    steps:
      - uses: actions/checkout@v5

      - name: Add dashboard from file
        run: cat badges.html >> $GITHUB_STEP_SUMMARY        
