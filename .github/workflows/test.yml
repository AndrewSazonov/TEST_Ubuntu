name: Test CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CI_BRANCH: ${{ github.head_ref || github.ref_name }}
  GITHUB_REPOSITORY: ${{ github.repository }}

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate dashboard SVG
        run: |
          cat > dashboard.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="390" height="330" viewBox="0 0 390 330">
            <rect width="100%" height="100%" fill="#f8f9fa"/>
            <rect x="10" y="10" width="120" height="60" fill="#4CAF50" stroke="#333" stroke-width="2"/>
            <rect x="135" y="10" width="120" height="60" fill="#2196F3" stroke="#333" stroke-width="2"/>
            <rect x="260" y="10" width="120" height="60" fill="#FFC107" stroke="#333" stroke-width="2"/>
            <text x="70" y="45" font-size="20" text-anchor="middle" fill="#fff">Cell 1</text>
            <text x="195" y="45" font-size="20" text-anchor="middle" fill="#fff">Cell 2</text>
            <text x="320" y="45" font-size="20" text-anchor="middle" fill="#333">Cell 3</text>
            <!-- … (repeat for all 15 cells like before) … -->
          </svg>
          EOF

      - name: Prepare publish directory
        run: |
          mkdir -p _dashboard_publish/diffraction-lib/${{ github.ref_name }}
          cp dashboard.svg _dashboard_publish/diffraction-lib/${{ github.ref_name }}/

      - name: Publish to easyscience/dashboard master branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          external_repository: easyscience/dashboard
          publish_branch: master
          personal_token: ${{ secrets.GH_API_PERSONAL_ACCSESS_TOKEN }}
          publish_dir: ./_dashboard_publish
          keep_files: true

      - name: Add dashboard to summary
        run: |
          echo "![Dashboard](https://easyscience.github.io/dashboard/diffraction-lib/${{ github.ref_name }}/dashboard.svg)" >> $GITHUB_STEP_SUMMARY